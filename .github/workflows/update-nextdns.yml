name: Update NextDNS Denylist

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install nextdnsctl
        run: pip install nextdnsctl

      - name: Update denylist for all accounts
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}
        run: |
          set -euo pipefail

          LISTS_FILE="blocklists.txt"

          if [ ! -f "$LISTS_FILE" ]; then
            echo "::error::Blocklists file not found: $LISTS_FILE"
            echo "Create it with one blocklist URL per line."
            exit 1
          fi

          url_count=$(grep -cv '^\s*$\|^\s*#' "$LISTS_FILE" || true)

          if [ "$url_count" -eq 0 ]; then
            echo "::error::No URLs found in $LISTS_FILE"
            exit 1
          fi

          echo "Found $url_count blocklist URL(s) in $LISTS_FILE"

          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          COMBINED_RAW="$TEMP_DIR/blocklist_combined_raw.txt"
          touch "$COMBINED_RAW"

          # ============================================================
          # DOWNLOAD BLOCKLISTS
          # ============================================================

          url_index=1

          while IFS= read -r url || [ -n "$url" ]; do
            url=$(echo "$url" \
              | sed 's/[[:space:]]*$//' \
              | sed 's/^[[:space:]]*//')

            [ -z "$url" ] && continue

            case "$url" in
              \#*) continue ;;
            esac

            echo ""
            echo "============================================================"
            echo "Downloading blocklist $url_index / $url_count"
            echo "$url"
            echo "============================================================"

            if curl -sfL "$url" -o "$TEMP_DIR/source_$url_index.txt"; then
              lines=$(wc -l < "$TEMP_DIR/source_$url_index.txt")
              echo "✓ Downloaded ($lines lines)"

              cat "$TEMP_DIR/source_$url_index.txt" >> "$COMBINED_RAW"
            else
              echo "::error::Failed to download: $url"
              exit 1
            fi

            url_index=$((url_index + 1))

          done < "$LISTS_FILE"

          echo ""
          echo "Combined raw blocklist:"
          echo "$(wc -l < "$COMBINED_RAW") total lines"

          # ============================================================
          # CLEAN / NORMALIZE / DEDUPLICATE
          # ============================================================

          CLEAN_FILE="$TEMP_DIR/blocklist_clean.txt"

          sed 's/#.*//' "$COMBINED_RAW" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u > "$CLEAN_FILE" || true

          CLEAN_COUNT=$(wc -l < "$CLEAN_FILE")

          echo ""
          echo "============================================================"
          echo "Cleaning and deduplicating"
          echo "============================================================"
          echo "✓ Normalized combined blocklist: $CLEAN_COUNT unique domains"
          echo ""

          # ============================================================
          # ACCOUNT LOOP
          # ============================================================

          account_num=1
          total_failed=0

          while true; do

            secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
            api_key_value="${!secret_name:-}"

            if [ -z "$api_key_value" ]; then
              echo "No more accounts found."
              break
            fi

            echo ""
            echo "============================================================"
            echo "Processing Account Index: $account_num"
            echo "============================================================"

            export NEXTDNS_API_KEY="$api_key_value"

            # ==========================================================
            # FIND PROFILES
            # ==========================================================

            echo "Fetching all profiles for account $account_num..."

            profiles=$(
              nextdnsctl profile-list 2>/dev/null \
                | grep -oP '^[a-z0-9]+(?=:)' \
                | grep -v '^$' \
                || true
            )

            if [ -z "$profiles" ]; then
              echo "::warning::No profiles found for account $account_num"
              account_num=$((account_num + 1))
              continue
            fi

            echo "Found profiles:"
            echo "$profiles"
            echo ""

            account_failed=0

            # ==========================================================
            # PROFILE LOOP
            # ==========================================================

            for profile in $profiles; do

              echo ""
              echo "============================================================"
              echo "Profile: $profile"
              echo "Total source domains: $CLEAN_COUNT"
              echo "============================================================"

              # ========================================================
              # STEP 1 — EXPORT CURRENT DENYLIST
              # ========================================================

              echo ""
              echo "Reading existing NextDNS denylist..."

              if nextdnsctl denylist export "$profile" 2>/dev/null \
                | sed 's/#.*//' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                | grep -v '^$' \
                | sort -u > "$TEMP_DIR/current_${profile}.txt"
              then

                CURRENT_COUNT=$(wc -l < "$TEMP_DIR/current_${profile}.txt")

                echo "Existing denylist entries detected: $CURRENT_COUNT"

                # ======================================================
                # FIND STALE ENTRIES
                # ======================================================

                STALE_FILE="$TEMP_DIR/stale_${profile}.txt"

                comm -23 \
                  "$TEMP_DIR/current_${profile}.txt" \
                  "$CLEAN_FILE" \
                  > "$STALE_FILE"

                stale_count=$(wc -l < "$STALE_FILE")

                if [ "$stale_count" -gt 0 ]; then

                  echo ""
                  echo "Found $stale_count stale domain(s) to remove"

                  if xargs -r nextdnsctl denylist remove "$profile" \
                    < "$STALE_FILE" 2>&1
                  then
                    echo "✓ Removed $stale_count stale domain(s)"
                  else
                    echo "::warning::Some stale domains may not have been removed for profile $profile"
                  fi

                else
                  echo "No stale domains found"
                fi

              else

                echo "::warning::Failed to export denylist for profile $profile"
                echo "Skipping cleanup and continuing with import."

              fi

              # ========================================================
              # STEP 2 — IMPORT
              #
              # IMPORTANT:
              # We intentionally do NOT force a custom concurrency value.
              # nextdnsctl handles the API upload behavior itself.
              # ========================================================

              echo ""
              echo "============================================================"
              echo "🚀 NextDNS upload"
              echo "============================================================"
              echo "Profile: $profile"
              echo "Total unique source domains: $CLEAN_COUNT"
              echo ""
              echo "Starting nextdnsctl denylist import..."
              echo "Progress will be reported by nextdnsctl."
              echo ""

              START_TIME=$(date +%s)

              if nextdnsctl denylist import \
                "$profile" \
                "$COMBINED_RAW" \
                2>&1
              then

                END_TIME=$(date +%s)
                ELAPSED=$((END_TIME - START_TIME))

                HOURS=$((ELAPSED / 3600))
                MINUTES=$(((ELAPSED % 3600) / 60))
                SECONDS=$((ELAPSED % 60))

                echo ""
                echo "============================================================"
                echo "✅ NextDNS import completed"
                echo "============================================================"
                echo "Profile: $profile"
                echo "Source domains: $CLEAN_COUNT"
                printf 'Elapsed: %02d:%02d:%02d\n' \
                  "$HOURS" "$MINUTES" "$SECONDS"
                echo "============================================================"

              else

                echo ""
                echo "✗ Failed to import for profile: $profile"

                account_failed=1
                total_failed=1

              fi

              echo ""

            done

            # ==========================================================
            # ACCOUNT RESULT
            # ==========================================================

            if [ "$account_failed" -eq 0 ]; then
              echo "✓ All profiles updated successfully for account $account_num!"
            else
              echo "✗ Some profiles failed for account $account_num"
            fi

            account_num=$((account_num + 1))

          done

          # ============================================================
          # FINAL RESULT
          # ============================================================

          echo ""
          echo "============================================================"
          echo "Update cycle complete"
          echo "============================================================"

          if [ "$total_failed" -eq 1 ]; then
            echo "::error::Some accounts had failures"
            exit 1
          fi

          echo "✓ All accounts processed successfully!"
