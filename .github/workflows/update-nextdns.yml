name: Update NextDNS Denylist

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install nextdnsctl
        run: pip install nextdnsctl

      - name: Update denylist for all accounts
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}

        run: |
          set -euo pipefail

          LISTS_FILE="blocklists.txt"

          if [ ! -f "$LISTS_FILE" ]; then
              echo "::error::Blocklists file not found: $LISTS_FILE"
              exit 1
          fi

          url_count=$(grep -cv '^[[:space:]]*$\|^[[:space:]]*#' "$LISTS_FILE")

          if [ "$url_count" -eq 0 ]; then
              echo "::error::No URLs found in $LISTS_FILE"
              exit 1
          fi

          echo "Found $url_count blocklist URL(s)"

          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          COMBINED_RAW="$TEMP_DIR/blocklist_combined_raw.txt"
          CLEAN_FILE="$TEMP_DIR/blocklist_clean.txt"

          touch "$COMBINED_RAW"

          # ============================================================
          # DOWNLOAD BLOCKLISTS
          # ============================================================

          echo "============================================================"
          echo "Downloading blocklists"
          echo "============================================================"

          url_index=1

          while IFS= read -r url || [ -n "$url" ]; do

              url=$(echo "$url" \
                  | sed 's/[[:space:]]*$//' \
                  | sed 's/^[[:space:]]*//')

              [ -z "$url" ] && continue

              case "$url" in
                  \#*) continue ;;
              esac

              echo "Downloading list: $url"

              if curl -sfL "$url" -o "$TEMP_DIR/source_$url_index.txt"; then
                  lines=$(wc -l < "$TEMP_DIR/source_$url_index.txt")
                  echo "  ✓ Downloaded: $lines lines"
                  cat "$TEMP_DIR/source_$url_index.txt" >> "$COMBINED_RAW"
              else
                  echo "::error::Failed to download: $url"
                  exit 1
              fi

              url_index=$((url_index + 1))

          done < "$LISTS_FILE"

          echo ""
          echo "Combined raw blocklist:"
          wc -l "$COMBINED_RAW"

          # ============================================================
          # CLEAN + VALIDATE + DEDUPLICATE
          # ============================================================

          echo "============================================================"
          echo "Cleaning and deduplicating"
          echo "============================================================"

          ALL_CLEANED="$TEMP_DIR/all_cleaned.txt"
          INVALID_FILE="$TEMP_DIR/invalid_domains.txt"

          # Remove comments, whitespace and CRLF.
          # Keep only normal DNS domain names.
          awk '
          {
              gsub(/\r/, "")
              gsub(/^[ \t]+|[ \t]+$/, "")

              # Remove comments
              sub(/#.*/, "")

              # Trim again after comment removal
              gsub(/^[ \t]+|[ \t]+$/, "")

              if ($0 != "") {
                  print
              }
          }
          ' "$COMBINED_RAW" | sort -fu > "$ALL_CLEANED"

          # Identify invalid entries.
          : > "$INVALID_FILE"

          while IFS= read -r domain; do

              if ! [[ "$domain" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$ ]]; then
                  echo "$domain" >> "$INVALID_FILE"
              fi

          done < "$ALL_CLEANED"

          # Keep only valid normal domain names.
          while IFS= read -r domain; do

              if [[ "$domain" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$ ]]; then
                  echo "$domain"
              fi

          done < "$ALL_CLEANED" | sort -fu > "$CLEAN_FILE"

          CLEAN_COUNT=$(wc -l < "$CLEAN_FILE")
          INVALID_COUNT=$(wc -l < "$INVALID_FILE")

          echo "✓ Normalized combined blocklist: $CLEAN_COUNT unique domains"

          if [ "$INVALID_COUNT" -gt 0 ]; then
              echo "⚠ Excluded $INVALID_COUNT invalid source entries"

              echo "Invalid source entries:"
              cat "$INVALID_FILE"
          fi

          # ============================================================
          # ACCOUNT LOOP
          # ============================================================

          account_num=1
          total_failed=0

          while true; do

              secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
              api_key_value="${!secret_name:-}"

              if [ -z "$api_key_value" ]; then
                  echo ""
                  echo "No more accounts found."
                  break
              fi

              echo ""
              echo "============================================================"
              echo "Processing Account Index: $account_num"
              echo "============================================================"

              export NEXTDNS_API_KEY="$api_key_value"

              # ==========================================================
              # GET PROFILES
              # ==========================================================

              echo "Fetching all profiles for account $account_num..."

              profiles=$(
                  nextdnsctl profile-list 2>/dev/null \
                    | grep -oP '^[a-z0-9]+(?=:)' \
                    | grep -v '^$' || true
              )

              if [ -z "$profiles" ]; then
                  echo "::warning::No profiles found for account $account_num"
                  account_num=$((account_num + 1))
                  continue
              fi

              echo "Found profiles:"
              echo "$profiles"

              account_failed=0

              # ==========================================================
              # PROFILE LOOP
              # ==========================================================

              for profile in $profiles; do

                  echo ""
                  echo "============================================================"
                  echo "Profile: $profile"
                  echo "Total source domains: $CLEAN_COUNT"
                  echo "============================================================"

                  CURRENT_FILE="$TEMP_DIR/current_${profile}.txt"
                  MISSING_FILE="$TEMP_DIR/missing_${profile}.txt"
                  STALE_FILE="$TEMP_DIR/stale_${profile}.txt"

                  # ======================================================
                  # EXPORT CURRENT DENYLIST
                  # ======================================================

                  echo "Reading existing NextDNS denylist..."

                  if ! nextdnsctl denylist export "$profile" 2>/dev/null \
                      | sed 's/#.*//' \
                      | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                      | sed 's/\r$//' \
                      | grep -v '^$' \
                      | sort -fu > "$CURRENT_FILE"; then

                      echo "::error::Failed to export denylist for profile $profile"
                      account_failed=1
                      total_failed=1
                      continue
                  fi

                  EXISTING_COUNT=$(wc -l < "$CURRENT_FILE")

                  echo "Existing denylist entries detected: $EXISTING_COUNT"

                  # ======================================================
                  # CALCULATE DELTAS
                  # ======================================================

                  comm -23 "$CURRENT_FILE" "$CLEAN_FILE" > "$STALE_FILE"
                  comm -13 "$CURRENT_FILE" "$CLEAN_FILE" > "$MISSING_FILE"

                  STALE_COUNT=$(wc -l < "$STALE_FILE")
                  MISSING_COUNT=$(wc -l < "$MISSING_FILE")

                  if [ "$STALE_COUNT" -gt 0 ]; then

                      echo ""
                      echo "Found $STALE_COUNT stale domain(s) to remove"
                      echo "Removing stale domains..."

                      echo "Denylist removal plan:"
                      echo "  Domains to remove: $STALE_COUNT"

                      if xargs -r nextdnsctl denylist remove "$profile" \
                          < "$STALE_FILE"; then

                          echo "✓ Removed $STALE_COUNT stale domain(s)"

                      else

                          echo "::warning::Some stale domains may not have been removed"

                      fi

                  else

                      echo "No stale domains found"

                  fi

                  echo ""
                  echo "============================================================"
                  echo "Denylist plan"
                  echo "============================================================"
                  echo "Total source domains: $CLEAN_COUNT"
                  echo "Already present: $((CLEAN_COUNT - MISSING_COUNT))"
                  echo "New domains to add: $MISSING_COUNT"
                  echo "============================================================"

                  # Show the exact missing domains.
                  if [ "$MISSING_COUNT" -gt 0 ]; then
                      echo ""
                      echo "Domains detected as new:"
                      echo "----------------------------------------"
                      cat -n "$MISSING_FILE"
                      echo "----------------------------------------"
                  fi

                  if [ "$MISSING_COUNT" -eq 0 ]; then
                      echo "✓ Nothing new to upload."
                      continue
                  fi

                  # ======================================================
                  # SINGLE FAST IMPORT
                  # ======================================================

                  echo ""
                  echo "============================================================"
                  echo "🚀 Starting NextDNS upload"
                  echo "============================================================"
                  echo "Profile: $profile"
                  echo "New domains: $MISSING_COUNT"
                  echo "Mode: Single import"
                  echo "============================================================"

                  START_TIME=$(date +%s)

                  UPLOAD_LOG="$TEMP_DIR/upload_${profile}.log"

                  # ------------------------------------------------------
                  # Start import in background.
                  # ------------------------------------------------------

                  set +e

                  nextdnsctl denylist import \
                      "$profile" \
                      "$MISSING_FILE" \
                      > "$UPLOAD_LOG" 2>&1 &

                  UPLOAD_PID=$!

                  set -e

                  # ======================================================
                  # LIVE PROGRESS MONITOR
                  # ======================================================

                  LAST_COUNT=0
                  LAST_TIME="$START_TIME"

                  echo ""
                  echo "📊 Live progress monitor started"
                  echo ""

                  while kill -0 "$UPLOAD_PID" 2>/dev/null; do

                      sleep 30

                      NOW=$(date +%s)
                      ELAPSED=$((NOW - START_TIME))

                      MONITOR_FILE="$TEMP_DIR/monitor_${profile}.txt"

                      if nextdnsctl denylist export "$profile" 2>/dev/null \
                          | sed 's/#.*//' \
                          | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                          | sed 's/\r$//' \
                          | grep -v '^$' \
                          | sort -fu > "$MONITOR_FILE"; then

                          CURRENT_TOTAL=$(wc -l < "$MONITOR_FILE")

                          CURRENT_ADDED=$(comm -12 \
                              "$MISSING_FILE" \
                              "$MONITOR_FILE" \
                              | wc -l)

                          if [ "$CURRENT_ADDED" -gt "$MISSING_COUNT" ]; then
                              CURRENT_ADDED="$MISSING_COUNT"
                          fi

                          REMAINING=$((MISSING_COUNT - CURRENT_ADDED))

                          if [ "$ELAPSED" -gt 0 ]; then
                              RATE=$((CURRENT_ADDED / ELAPSED))
                          else
                              RATE=0
                          fi

                          if [ "$RATE" -gt 0 ]; then
                              ETA_SECONDS=$((REMAINING / RATE))
                          else
                              ETA_SECONDS=0
                          fi

                          HOURS=$((ETA_SECONDS / 3600))
                          MINUTES=$(((ETA_SECONDS % 3600) / 60))
                          SECONDS=$((ETA_SECONDS % 60))

                          if [ "$MISSING_COUNT" -gt 0 ]; then
                              PERCENT=$((CURRENT_ADDED * 100 / MISSING_COUNT))
                          else
                              PERCENT=100
                          fi

                          echo ""
                          echo "------------------------------------------------------------"
                          echo "📊 NextDNS upload progress"
                          echo "Profile: $profile"
                          echo "Uploaded: $CURRENT_ADDED / $MISSING_COUNT"
                          echo "Remaining: $REMAINING"
                          echo "Progress: ${PERCENT}%"
                          echo "Elapsed: ${ELAPSED}s"
                          echo "Rate: ${RATE} domains/sec"
                          printf 'ETA: %02d:%02d:%02d\n' \
                              "$HOURS" "$MINUTES" "$SECONDS"
                          echo "------------------------------------------------------------"

                          LAST_COUNT="$CURRENT_ADDED"
                          LAST_TIME="$NOW"

                      else

                          echo "⏳ Upload still running... progress check unavailable."

                      fi

                  done

                  # ======================================================
                  # WAIT FOR IMPORT RESULT
                  # ======================================================

                  set +e
                  wait "$UPLOAD_PID"
                  UPLOAD_EXIT=$?
                  set -e

                  END_TIME=$(date +%s)
                  ELAPSED=$((END_TIME - START_TIME))

                  echo ""
                  echo "============================================================"
                  echo "NextDNS import finished"
                  echo "============================================================"

                  cat "$UPLOAD_LOG"

                  if [ "$UPLOAD_EXIT" -eq 0 ]; then

                      echo ""
                      echo "============================================================"
                      echo "✅ NextDNS upload completed"
                      echo "============================================================"
                      echo "Profile: $profile"
                      echo "Domains submitted: $MISSING_COUNT"
                      echo "Elapsed: ${ELAPSED}s"

                      if [ "$ELAPSED" -gt 0 ]; then
                          FINAL_RATE=$((MISSING_COUNT / ELAPSED))
                          echo "Average rate: ${FINAL_RATE} domains/sec"
                      fi

                      echo "============================================================"

                  else

                      echo ""
                      echo "::error::NextDNS upload failed for profile $profile"

                      account_failed=1
                      total_failed=1

                  fi

              done

              if [ "$account_failed" -eq 0 ]; then
                  echo ""
                  echo "✓ Account $account_num completed successfully!"
              else
                  echo ""
                  echo "✗ Some profiles failed for account $account_num"
              fi

              account_num=$((account_num + 1))

          done

          echo ""
          echo "============================================================"
          echo "Update cycle complete"
          echo "============================================================"

          if [ "$total_failed" -eq 1 ]; then
              echo "::error::Some accounts/profiles had failures"
              exit 1
          fi

          echo "✓ All accounts processed successfully!"
