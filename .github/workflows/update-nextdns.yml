name: Update NextDNS Denylist

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install nextdnsctl
        run: pip install nextdnsctl

      - name: Update denylist for all accounts
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}
        run: |
          set -euo pipefail

          # ============================================================
          # CONFIGURATION
          # ============================================================

          LISTS_FILE="blocklists.txt"

          # Number of batches allowed to run simultaneously.
          # 8 was the version that was actually making progress.
          CONCURRENCY=8

          # Domains per NextDNS import.
          BATCH_SIZE=100

          # Retry configuration.
          RETRY_ATTEMPTS=8
          RETRY_DELAY=5

          # ============================================================
          # VALIDATE BLOCKLIST FILE
          # ============================================================

          if [ ! -f "$LISTS_FILE" ]; then
            echo "::error::Blocklists file not found: $LISTS_FILE"
            exit 1
          fi

          url_count=$(grep -cv '^\s*$\|^\s*#' "$LISTS_FILE")

          if [ "$url_count" -eq 0 ]; then
            echo "::error::No URLs found in $LISTS_FILE"
            exit 1
          fi

          echo "Found $url_count blocklist URL(s)"

          # ============================================================
          # TEMPORARY FILES
          # ============================================================

          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          COMBINED_RAW="$TEMP_DIR/blocklist_combined_raw.txt"
          CLEAN_FILE="$TEMP_DIR/blocklist_clean.txt"

          touch "$COMBINED_RAW"

          # ============================================================
          # DOWNLOAD BLOCKLISTS
          # ============================================================

          echo "============================================================"
          echo "Downloading blocklists"
          echo "============================================================"

          url_index=1

          while IFS= read -r url || [ -n "$url" ]; do
            url=$(echo "$url" \
              | sed 's/[[:space:]]*$//' \
              | sed 's/^[[:space:]]*//')

            [ -z "$url" ] && continue

            case "$url" in
              \#*) continue ;;
            esac

            echo "Downloading list: $url"

            if curl -sfL --retry 3 --retry-delay 2 "$url" \
              -o "$TEMP_DIR/source_$url_index.txt"; then

              lines=$(wc -l < "$TEMP_DIR/source_$url_index.txt")

              echo "  ✓ Downloaded: $lines lines"

              cat "$TEMP_DIR/source_$url_index.txt" >> "$COMBINED_RAW"

            else
              echo "::error::Failed to download: $url"
              exit 1
            fi

            url_index=$((url_index + 1))

          done < "$LISTS_FILE"

          RAW_COUNT=$(wc -l < "$COMBINED_RAW")

          echo ""
          echo "Combined raw blocklist:"
          echo "$RAW_COUNT total lines"

          # ============================================================
          # CLEAN / NORMALIZE / DEDUPLICATE
          # ============================================================

          echo "============================================================"
          echo "Cleaning and deduplicating"
          echo "============================================================"

          sed 's/#.*//' "$COMBINED_RAW" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u > "$CLEAN_FILE"

          CLEAN_COUNT=$(wc -l < "$CLEAN_FILE")

          echo "✓ Normalized combined blocklist: $CLEAN_COUNT unique domains"

          # ============================================================
          # ACCOUNT LOOP
          # ============================================================

          account_num=1
          total_failed=0

          while true; do

            secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
            api_key_value="${!secret_name:-}"

            if [ -z "$api_key_value" ]; then
              echo ""
              echo "No more accounts found."
              break
            fi

            echo ""
            echo "============================================================"
            echo "Processing Account Index: $account_num"
            echo "============================================================"

            export NEXTDNS_API_KEY="$api_key_value"

            # ==========================================================
            # FIND PROFILES
            # ==========================================================

            echo "Fetching all profiles for account $account_num..."

            profiles=$(
              nextdnsctl profile-list 2>/dev/null \
                | grep -oP '^[a-z0-9]+(?=:)' \
                | grep -v '^$' \
                || true
            )

            if [ -z "$profiles" ]; then
              echo "::warning::No profiles found for account $account_num"
              account_num=$((account_num + 1))
              continue
            fi

            echo "Found profiles:"
            echo "$profiles"

            account_failed=0

            # ==========================================================
            # PROFILE LOOP
            # ==========================================================

            for profile in $profiles; do

              echo ""
              echo "============================================================"
              echo "Profile: $profile"
              echo "Total source domains: $CLEAN_COUNT"
              echo "============================================================"

              # --------------------------------------------------------
              # EXPORT EXISTING DENYLIST
              # --------------------------------------------------------

              echo "Reading existing NextDNS denylist..."

              CURRENT_FILE="$TEMP_DIR/current_${profile}.txt"

              if ! nextdnsctl denylist export "$profile" 2>/dev/null \
                | sed 's/#.*//' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                | grep -v '^$' \
                | sort -u > "$CURRENT_FILE"; then

                echo "::warning::Could not export denylist for $profile"
                account_failed=1
                total_failed=1
                continue
              fi

              EXISTING_COUNT=$(wc -l < "$CURRENT_FILE")

              echo "Existing denylist entries detected: $EXISTING_COUNT"

              # --------------------------------------------------------
              # REMOVE STALE DOMAINS
              # --------------------------------------------------------

              STALE_FILE="$TEMP_DIR/stale_${profile}.txt"

              comm -23 "$CURRENT_FILE" "$CLEAN_FILE" > "$STALE_FILE"

              STALE_COUNT=$(wc -l < "$STALE_FILE")

              if [ "$STALE_COUNT" -gt 0 ]; then

                echo "Found $STALE_COUNT stale domain(s) to remove"
                echo "Removing stale domains..."

                if xargs -r nextdnsctl denylist remove "$profile" \
                  < "$STALE_FILE" 2>&1; then

                  echo "✓ Removed $STALE_COUNT stale domain(s)"

                else
                  echo "::warning::Some stale domains may not have been removed"
                fi

                # Refresh current list after removal.
                if nextdnsctl denylist export "$profile" 2>/dev/null \
                  | sed 's/#.*//' \
                  | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                  | grep -v '^$' \
                  | sort -u > "$CURRENT_FILE"; then
                  :
                fi

              else
                echo "No stale domains found"
              fi

              # --------------------------------------------------------
              # CALCULATE DELTA
              # --------------------------------------------------------

              NEW_FILE="$TEMP_DIR/new_${profile}.txt"

              comm -13 "$CURRENT_FILE" "$CLEAN_FILE" > "$NEW_FILE"

              NEW_COUNT=$(wc -l < "$NEW_FILE")

              echo ""
              echo "============================================================"
              echo "Denylist plan"
              echo "============================================================"
              echo "Total source domains: $CLEAN_COUNT"
              echo "Already present: $(wc -l < "$CURRENT_FILE")"
              echo "New domains to add: $NEW_COUNT"
              echo "============================================================"

              if [ "$NEW_COUNT" -eq 0 ]; then
                echo "✓ Nothing new to upload."
                continue
              fi

              # --------------------------------------------------------
              # PREPARE BATCHES
              # --------------------------------------------------------

              BATCH_DIR="$TEMP_DIR/batches_${profile}"
              rm -rf "$BATCH_DIR"
              mkdir -p "$BATCH_DIR"

              split -l "$BATCH_SIZE" -d -a 5 \
                "$NEW_FILE" "$BATCH_DIR/batch_"

              TOTAL_BATCHES=$(find "$BATCH_DIR" -type f | wc -l)

              echo ""
              echo "🚀 Starting NextDNS upload"
              echo "Profile: $profile"
              echo "New domains: $NEW_COUNT"
              echo "Batch size: $BATCH_SIZE"
              echo "Concurrency: $CONCURRENCY"
              echo "Retry attempts: $RETRY_ATTEMPTS"
              echo "Total batches: $TOTAL_BATCHES"
              echo "============================================================"

              # --------------------------------------------------------
              # BATCH WORKER
              # --------------------------------------------------------

              upload_batch() {
                local batch_file="$1"
                local batch_number="$2"

                local attempt=1
                local success=0

                local batch_domains
                batch_domains=$(wc -l < "$batch_file")

                while [ "$attempt" -le "$RETRY_ATTEMPTS" ]; do

                  echo "Batch $batch_number / $TOTAL_BATCHES"
                  echo "Domains in batch: $batch_domains"
                  echo "Attempt: $attempt / $RETRY_ATTEMPTS"

                  # Do NOT pipe nextdnsctl output through tail/head.
                  # That caused the previous Broken pipe failure.

                  if nextdnsctl denylist import \
                    "$profile" \
                    "$batch_file" \
                    --update-existing; then

                    success=1
                    break
                  fi

                  if [ "$attempt" -lt "$RETRY_ATTEMPTS" ]; then
                    echo "Batch $batch_number failed."
                    echo "Waiting ${RETRY_DELAY}s before retry..."
                    sleep "$RETRY_DELAY"
                  fi

                  attempt=$((attempt + 1))
                done

                if [ "$success" -eq 1 ]; then
                  echo "✓ Batch $batch_number completed: $batch_domains domains"
                  return 0
                fi

                echo "::error::Batch $batch_number failed after $RETRY_ATTEMPTS attempts"
                return 1
              }

              # --------------------------------------------------------
              # CONTROLLED PARALLEL UPLOAD
              # --------------------------------------------------------

              START_TIME=$(date +%s)
              COMPLETED_BATCHES=0
              FAILED_BATCHES=0

              # Process batches in groups of CONCURRENCY.
              #
              # This avoids launching thousands of simultaneous requests
              # while still allowing multiple batches to be active.

              batch_index=0

              for batch_file in "$BATCH_DIR"/batch_*; do

                batch_index=$((batch_index + 1))

                upload_batch "$batch_file" "$batch_index" &

                # Once CONCURRENCY jobs are running, wait for them.
                if [ $((batch_index % CONCURRENCY)) -eq 0 ]; then

                  group_failed=0

                  for job in $(jobs -pr); do
                    if ! wait "$job"; then
                      group_failed=1
                    fi
                  done

                  if [ "$group_failed" -ne 0 ]; then
                    FAILED_BATCHES=$((FAILED_BATCHES + 1))
                  fi

                  # Count completed batches conservatively from successful
                  # groups. This prevents bogus 0-rate ETA calculations.

                  COMPLETED_BATCHES="$batch_index"

                  NOW=$(date +%s)
                  ELAPSED=$((NOW - START_TIME))

                  if [ "$ELAPSED" -gt 0 ]; then
                    UPLOADED=$((COMPLETED_BATCHES * BATCH_SIZE))

                    if [ "$UPLOADED" -gt "$NEW_COUNT" ]; then
                      UPLOADED="$NEW_COUNT"
                    fi

                    RATE=$((UPLOADED / ELAPSED))

                    if [ "$RATE" -gt 0 ]; then
                      REMAINING=$((NEW_COUNT - UPLOADED))
                      ETA_SECONDS=$((REMAINING / RATE))

                      ETA_H=$((ETA_SECONDS / 3600))
                      ETA_M=$(((ETA_SECONDS % 3600) / 60))
                      ETA_S=$((ETA_SECONDS % 60))

                      ETA=$(printf "%02d:%02d:%02d" \
                        "$ETA_H" "$ETA_M" "$ETA_S")
                    else
                      ETA="Calculating..."
                    fi

                    PERCENT=$((UPLOADED * 100 / NEW_COUNT))

                    echo ""
                    echo "------------------------------------------------------------"
                    echo "📊 NextDNS upload progress"
                    echo "Profile: $profile"
                    echo "Uploaded: $UPLOADED / $NEW_COUNT"
                    echo "Remaining: $((NEW_COUNT - UPLOADED))"
                    echo "Progress: ${PERCENT}%"
                    echo "Elapsed: ${ELAPSED}s"
                    echo "Rate: ${RATE} domains/sec"
                    echo "ETA: ${ETA}"
                    echo "Completed batches: ${COMPLETED_BATCHES}/${TOTAL_BATCHES}"
                    echo "------------------------------------------------------------"
                  fi
                fi

              done

              # --------------------------------------------------------
              # WAIT FOR FINAL PARTIAL GROUP
              # --------------------------------------------------------

              final_failed=0

              for job in $(jobs -pr); do
                if ! wait "$job"; then
                  final_failed=1
                fi
              done

              if [ "$final_failed" -ne 0 ]; then
                echo "::error::One or more upload batches failed."
                account_failed=1
                total_failed=1
                continue
              fi

              END_TIME=$(date +%s)
              ELAPSED=$((END_TIME - START_TIME))

              if [ "$ELAPSED" -lt 1 ]; then
                ELAPSED=1
              fi

              RATE=$((NEW_COUNT / ELAPSED))

              echo ""
              echo "============================================================"
              echo "✅ NextDNS upload completed"
              echo "============================================================"
              echo "Profile: $profile"
              echo "Domains uploaded: $NEW_COUNT"
              echo "Elapsed: ${ELAPSED}s"
              echo "Average rate: ${RATE} domains/sec"
              echo "============================================================"

            done

            if [ "$account_failed" -eq 0 ]; then
              echo "✓ All profiles updated successfully for account $account_num!"
            else
              echo "✗ Some profiles failed for account $account_num"
            fi

            account_num=$((account_num + 1))

          done

          echo ""
          echo "============================================================"
          echo "Update cycle complete"
          echo "============================================================"

          if [ "$total_failed" -eq 1 ]; then
            echo "::error::Some accounts or profiles had failures"
            exit 1
          fi

          echo "✓ All accounts processed successfully!"
