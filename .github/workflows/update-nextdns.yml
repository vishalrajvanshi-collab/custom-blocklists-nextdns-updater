- name: Parallel Sync to NextDNS Profiles
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}

        run: |
          set -euo pipefail

          # -------------------------------------------------------------
          # PROFILE CONFIGURATION
          # Add more 6-character profile IDs here when needed.
          # Example:
          # TARGET_PROFILES=("111a83" "222b94" "333c05")
          # -------------------------------------------------------------
          TARGET_PROFILES=("111a83")

          # -------------------------------------------------------------
          # UPLOAD TUNING
          #
          # 8 was triggering NextDNS rate limiting.
          # Keep this conservative so the upload can continuously progress.
          # -------------------------------------------------------------
          CONCURRENCY=4
          RETRY_ATTEMPTS=10
          RETRY_DELAY=5

          echo "nextdnsctl concurrency tuning: ENABLED"
          echo "Concurrency: $CONCURRENCY"
          echo "Retry attempts: $RETRY_ATTEMPTS"
          echo "Retry delay: ${RETRY_DELAY}s"

          TOTAL_DOMAINS=$(wc -l < final_blocklist.txt | tr -d ' ')
          echo "Total unique domains to process: $TOTAL_DOMAINS"

          account_num=1

          while true; do
            secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
            api_key_value="${!secret_name:-}"

            if [ -z "$api_key_value" ]; then
              echo "Finished checking all configured accounts."
              break
            fi

            echo "============================================================"
            echo "Syncing Account Index: $account_num"
            echo "============================================================"

            nextdnsctl auth "$api_key_value"

            for profile in "${TARGET_PROFILES[@]}"; do

              echo "------------------------------------------------------------"
              echo "Synchronizing profile: $profile"
              echo "Domains in source list: $TOTAL_DOMAINS"
              echo "------------------------------------------------------------"

              # ---------------------------------------------------------
              # First obtain the current denylist.
              # This lets us calculate exactly how many NEW domains
              # actually need to be uploaded.
              # ---------------------------------------------------------

              CURRENT_FILE="current_${profile}.txt"

              nextdnsctl denylist export "$profile" > "$CURRENT_FILE"

              # Extract domain IDs from the exported JSON when possible.
              # If the installed nextdnsctl returns plain domain lines,
              # the fallback keeps those lines.
              python - "$CURRENT_FILE" "$profile" <<'PY'
          import json
          import sys

          filename = sys.argv[1]
          profile = sys.argv[2]

          with open(filename, "r", encoding="utf-8", errors="ignore") as f:
              text = f.read().strip()

          domains = set()

          try:
              data = json.loads(text)

              if isinstance(data, dict):
                  items = data.get("data", data.get("denylist", []))
              elif isinstance(data, list):
                  items = data
              else:
                  items = []

              if isinstance(items, list):
                  for item in items:
                      if isinstance(item, dict):
                          domain = item.get("id")
                          if domain:
                              domains.add(str(domain).strip().lower())
                      elif isinstance(item, str):
                          domains.add(item.strip().lower())

          except Exception:
              pass

          if not domains:
              for line in text.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  domains.add(line.lower())

          with open(f"existing_{profile}.txt", "w", encoding="utf-8") as out:
              for domain in sorted(domains):
                  out.write(domain + "\n")

          print(f"Existing denylist entries detected: {len(domains)}")
          PY

              # ---------------------------------------------------------
              # Calculate domains that actually need uploading.
              # ---------------------------------------------------------

              grep -Fvx -f "existing_${profile}.txt" final_blocklist.txt \
                > "pending_${profile}.txt" || true

              NEW_DOMAINS=$(wc -l < "pending_${profile}.txt" | tr -d ' ')

              echo "============================================================"
              echo "NextDNS upload"
              echo "Profile: $profile"
              echo "Total source domains: $TOTAL_DOMAINS"
              echo "Already present: $((TOTAL_DOMAINS - NEW_DOMAINS))"
              echo "New domains to upload: $NEW_DOMAINS"
              echo "Concurrency: $CONCURRENCY"
              echo "============================================================"

              if [ "$NEW_DOMAINS" -eq 0 ]; then
                echo "No new domains need uploading."
                continue
              fi

              # ---------------------------------------------------------
              # Progress display.
              #
              # nextdnsctl itself doesn't expose a successful-domain
              # counter, so we upload in small batches. Each successfully
              # completed batch increments the displayed counter.
              #
              # The actual NextDNS API operation remains nextdnsctl.
              # ---------------------------------------------------------

              BATCH_SIZE=100

              START_TIME=$(date +%s)
              UPLOADED=0
              BATCH_NUMBER=0
              TOTAL_BATCHES=$(( (NEW_DOMAINS + BATCH_SIZE - 1) / BATCH_SIZE ))

              while [ "$UPLOADED" -lt "$NEW_DOMAINS" ]; do

                BATCH_NUMBER=$((BATCH_NUMBER + 1))

                BATCH_FILE="batch_${profile}_${BATCH_NUMBER}.txt"

                tail -n +"$((UPLOADED + 1))" "pending_${profile}.txt" \
                  | head -n "$BATCH_SIZE" > "$BATCH_FILE"

                CURRENT_BATCH=$(wc -l < "$BATCH_FILE" | tr -d ' ')

                if [ "$CURRENT_BATCH" -eq 0 ]; then
                  break
                fi

                # -------------------------------------------------------
                # Retry a whole batch if NextDNS rate-limits the request.
                # We deliberately avoid spawning another huge wave of
                # requests while the API is already rate limiting us.
                # -------------------------------------------------------

                ATTEMPT=1

                while true; do

                  if nextdnsctl \
                    --concurrency "$CONCURRENCY" \
                    --retry-attempts "$RETRY_ATTEMPTS" \
                    --retry-delay "$RETRY_DELAY" \
                    denylist import "$profile" "$BATCH_FILE" \
                    --update-existing; then

                    break
                  fi

                  if [ "$ATTEMPT" -ge "$RETRY_ATTEMPTS" ]; then
                    echo "::error::Batch $BATCH_NUMBER failed after $ATTEMPT attempts."
                    exit 1
                  fi

                  WAIT=$((RETRY_DELAY * ATTEMPT))

                  if [ "$WAIT" -gt 60 ]; then
                    WAIT=60
                  fi

                  echo "Batch $BATCH_NUMBER failed."
                  echo "Waiting ${WAIT}s before retry $((ATTEMPT + 1))/${RETRY_ATTEMPTS}..."

                  sleep "$WAIT"

                  ATTEMPT=$((ATTEMPT + 1))
                done

                # -------------------------------------------------------
                # The batch completed successfully.
                # Now and only now do we increase the displayed counter.
                # -------------------------------------------------------

                UPLOADED=$((UPLOADED + CURRENT_BATCH))

                NOW=$(date +%s)
                ELAPSED=$((NOW - START_TIME))

                if [ "$ELAPSED" -gt 0 ]; then
                  RATE=$((UPLOADED / ELAPSED))
                else
                  RATE=0
                fi

                REMAINING=$((NEW_DOMAINS - UPLOADED))

                if [ "$NEW_DOMAINS" -gt 0 ]; then
                  PROGRESS=$(awk \
                    -v done="$UPLOADED" \
                    -v total="$NEW_DOMAINS" \
                    'BEGIN { printf "%.1f", (done / total) * 100 }')
                else
                  PROGRESS="100.0"
                fi

                if [ "$RATE" -gt 0 ]; then
                  ETA_SECONDS=$((REMAINING / RATE))
                else
                  ETA_SECONDS=0
                fi

                ETA_H=$((ETA_SECONDS / 3600))
                ETA_M=$(((ETA_SECONDS % 3600) / 60))
                ETA_S=$((ETA_SECONDS % 60))

                ELAPSED_H=$((ELAPSED / 3600))
                ELAPSED_M=$(((ELAPSED % 3600) / 60))
                ELAPSED_S=$((ELAPSED % 60))

                printf '\n'
                echo "🚀 NextDNS upload"
                echo "Uploaded: $UPLOADED / $NEW_DOMAINS"
                echo "Remaining: $REMAINING"
                echo "Progress: ${PROGRESS}%"
                printf 'Elapsed: %02d:%02d:%02d\n' \
                  "$ELAPSED_H" "$ELAPSED_M" "$ELAPSED_S"
                echo "Rate: ${RATE} domains/sec"
                printf 'ETA: %02d:%02d:%02d\n' \
                  "$ETA_H" "$ETA_M" "$ETA_S"
                echo "Batch: $BATCH_NUMBER / $TOTAL_BATCHES"
                echo "Concurrency: $CONCURRENCY"
                printf '\n'

                rm -f "$BATCH_FILE"

              done

              echo "============================================================"
              echo "Successfully synchronized profile: $profile"
              echo "Uploaded: $UPLOADED / $NEW_DOMAINS new domains"
              echo "============================================================"

              rm -f \
                "$CURRENT_FILE" \
                "existing_${profile}.txt" \
                "pending_${profile}.txt"

            done

            account_num=$((account_num + 1))
          done
