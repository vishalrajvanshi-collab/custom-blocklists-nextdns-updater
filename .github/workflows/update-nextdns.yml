name: Update NextDNS Denylist

on:
  schedule:
    - cron: '0 2 * * *' # Auto-updates every day at 02:00 UTC
  workflow_dispatch: # Manual trigger from Actions

permissions:
  contents: read

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install nextdnsctl engine
        run: |
          python -m pip install --upgrade pip
          pip install nextdnsctl
          nextdnsctl --version

      - name: Merge and Download Blocklists
        shell: bash
        run: |
          set -euo pipefail

          LISTS_FILE="blocklists.txt"

          if [ ! -f "$LISTS_FILE" ]; then
            echo "::error::blocklists.txt file not found!"
            exit 1
          fi

          COMBINED_RAW="combined_raw.txt"
          FINAL_BLOCKLIST="final_blocklist.txt"

          rm -f "$COMBINED_RAW" "$FINAL_BLOCKLIST"
          touch "$COMBINED_RAW"

          echo "============================================================"
          echo "Downloading blocklists"
          echo "============================================================"

          while IFS= read -r url || [ -n "$url" ]; do
            url="$(echo "$url" | xargs)"

            [[ -z "$url" ]] && continue
            [[ "$url" =~ ^# ]] && continue

            echo "Downloading list: $url"

            if ! curl -fL --retry 3 --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              "$url" >> "$COMBINED_RAW"; then
              echo "::warning::Failed to fetch $url"
            fi

          done < "$LISTS_FILE"

          echo "============================================================"
          echo "Cleaning and deduplicating"
          echo "============================================================"

          sed 's/#.*//' "$COMBINED_RAW" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u \
            > "$FINAL_BLOCKLIST"

          TOTAL_DOMAINS="$(wc -l < "$FINAL_BLOCKLIST")"

          echo "Total unique domains: $TOTAL_DOMAINS"

          if [ "$TOTAL_DOMAINS" -eq 0 ]; then
            echo "::error::No domains were found!"
            exit 1
          fi

      - name: Sync to NextDNS Profiles
        shell: bash
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}
        run: |
          set -euo pipefail

          # ============================================================
          # CONFIGURATION
          # ============================================================

          # Add additional profile IDs here when needed.
          TARGET_PROFILES=("111a83")

          # Conservative concurrency to avoid NextDNS API rate limiting.
          CONCURRENCY=4

          # Number of domains handled per upload batch.
          BATCH_SIZE=100

          # Retry configuration.
          RETRY_ATTEMPTS=10
          RETRY_DELAY=5

          # ============================================================
          # PREPARATION
          # ============================================================

          FINAL_BLOCKLIST="final_blocklist.txt"

          TOTAL_DOMAINS="$(wc -l < "$FINAL_BLOCKLIST")"

          echo ""
          echo "============================================================"
          echo "NextDNS synchronization configuration"
          echo "============================================================"
          echo "Total unique domains: $TOTAL_DOMAINS"
          echo "Concurrency: $CONCURRENCY"
          echo "Retry attempts: $RETRY_ATTEMPTS"
          echo "Retry delay: ${RETRY_DELAY}s"
          echo "Batch size: $BATCH_SIZE"
          echo "============================================================"
          echo ""

          # ============================================================
          # ACCOUNT LOOP
          # ============================================================

          account_num=1

          while true; do
            secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
            api_key_value="${!secret_name:-}"

            if [ -z "$api_key_value" ]; then
              echo "Finished checking all configured accounts."
              break
            fi

            echo ""
            echo "============================================================"
            echo "Syncing Account Index: $account_num"
            echo "============================================================"

            nextdnsctl auth "$api_key_value"

            # ==========================================================
            # PROFILE LOOP
            # ==========================================================

            for profile in "${TARGET_PROFILES[@]}"; do

              echo ""
              echo "------------------------------------------------------------"
              echo "Synchronizing profile: $profile"
              echo "Domains in source list: $TOTAL_DOMAINS"
              echo "------------------------------------------------------------"

              # --------------------------------------------------------
              # IMPORTANT:
              # First perform the normal nextdnsctl synchronization.
              #
              # This preserves the original behavior:
              #   --update-existing
              #
              # We do NOT use tail/head pipelines for progress tracking.
              # --------------------------------------------------------

              START_TIME="$(date +%s)"

              echo ""
              echo "🚀 NextDNS upload"
              echo "Profile: $profile"
              echo "Total domains: $TOTAL_DOMAINS"
              echo "Concurrency: $CONCURRENCY"
              echo ""

              # --------------------------------------------------------
              # Run nextdnsctl directly.
              #
              # Do not pipe its output through tail.
              # This prevents the Broken pipe error.
              # --------------------------------------------------------

              if nextdnsctl denylist import \
                "$profile" \
                "$FINAL_BLOCKLIST" \
                --update-existing; then

                END_TIME="$(date +%s)"
                ELAPSED=$((END_TIME - START_TIME))

                if [ "$ELAPSED" -lt 1 ]; then
                  ELAPSED=1
                fi

                RATE=$((TOTAL_DOMAINS / ELAPSED))

                if [ "$RATE" -gt 0 ]; then
                  REMAINING_SECONDS=$((TOTAL_DOMAINS / RATE))
                else
                  REMAINING_SECONDS=0
                fi

                HOURS=$((REMAINING_SECONDS / 3600))
                MINUTES=$(((REMAINING_SECONDS % 3600) / 60))
                SECONDS=$((REMAINING_SECONDS % 60))

                printf '\n'
                echo "============================================================"
                echo "✅ NextDNS synchronization completed"
                echo "============================================================"
                echo "Profile: $profile"
                echo "Domains processed: $TOTAL_DOMAINS"
                echo "Elapsed: ${ELAPSED}s"
                echo "Average rate: ${RATE} domains/sec"
                printf '============================================================\n'
                echo ""

              else
                echo ""
                echo "::error::NextDNS synchronization failed for profile $profile"
                exit 1
              fi

            done

            account_num=$((account_num + 1))
          done

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f combined_raw.txt
          rm -f final_blocklist.txt
          echo "Temporary blocklist files removed."
