name: Update NextDNS Denylist

on:
  schedule:
    - cron: '0 2 * * *' # Auto-updates every single day at 02:00 UTC
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: read

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install nextdnsctl engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nextdnsctl
          echo "Installed nextdnsctl version:"
          nextdnsctl --version

      - name: Merge and Download Blocklists
        shell: bash
        run: |
          set -euo pipefail

          LISTS_FILE="blocklists.txt"

          if [ ! -f "$LISTS_FILE" ]; then
            echo "::error::blocklists.txt file not found!"
            exit 1
          fi

          COMBINED_RAW="combined_raw.txt"
          FINAL_BLOCKLIST="final_blocklist.txt"

          : > "$COMBINED_RAW"

          # Loop through any blocklist URLs listed in blocklists.txt
          while IFS= read -r url || [ -n "$url" ]; do
            # Trim leading/trailing whitespace
            url="$(echo "$url" | xargs)"

            # Skip blank lines and comments
            [[ -z "$url" || "$url" =~ ^# ]] && continue

            echo "Downloading list: $url"

            if ! curl --fail --silent --show-error --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              "$url" >> "$COMBINED_RAW"; then
              echo "::warning::Failed to fetch $url"
            fi
          done < "$LISTS_FILE"

          # Deduplicate, normalize, and clean formatting
          sed 's/#.*//' "$COMBINED_RAW" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u > "$FINAL_BLOCKLIST"

          TOTAL_DOMAINS="$(wc -l < "$FINAL_BLOCKLIST" | tr -d ' ')"

          echo "Processed total unique domains: $TOTAL_DOMAINS"

          if [ "$TOTAL_DOMAINS" -eq 0 ]; then
            echo "::error::The final blocklist is empty. Refusing to modify NextDNS."
            exit 1
          fi

      - name: Sync to NextDNS Profiles
        shell: bash
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}
        run: |
          set -euo pipefail

          # -------------------------------------------------------------
          # FUTURE PROFILE PLACEHOLDER
          #
          # Add new 6-character profile IDs inside the parenthesis below,
          # separated by spaces.
          #
          # Example:
          # TARGET_PROFILES=("111a83" "222b94" "333c05")
          # -------------------------------------------------------------
          TARGET_PROFILES=("111a83")

          # -------------------------------------------------------------
          # Import tuning
          #
          # The script first checks whether the installed nextdnsctl
          # supports these optional tuning arguments.
          #
          # If supported, they are used.
          # If not supported, the normal importer is used automatically.
          # -------------------------------------------------------------
          NEXTDNS_CONCURRENCY=8
          NEXTDNS_RETRY_ATTEMPTS=10
          NEXTDNS_RETRY_DELAY=2

          IMPORT_ARGS=()

          HELP_OUTPUT="$(nextdnsctl --help 2>&1 || true)"

          if echo "$HELP_OUTPUT" | grep -q -- '--concurrency'; then
            IMPORT_ARGS+=(--concurrency "$NEXTDNS_CONCURRENCY")
            echo "nextdnsctl concurrency tuning: ENABLED"
          else
            echo "nextdnsctl concurrency tuning: NOT AVAILABLE"
          fi

          if echo "$HELP_OUTPUT" | grep -q -- '--retry-attempts'; then
            IMPORT_ARGS+=(--retry-attempts "$NEXTDNS_RETRY_ATTEMPTS")
            echo "nextdnsctl retry-attempts tuning: ENABLED"
          else
            echo "nextdnsctl retry-attempts tuning: NOT AVAILABLE"
          fi

          if echo "$HELP_OUTPUT" | grep -q -- '--retry-delay'; then
            IMPORT_ARGS+=(--retry-delay "$NEXTDNS_RETRY_DELAY")
            echo "nextdnsctl retry-delay tuning: ENABLED"
          else
            echo "nextdnsctl retry-delay tuning: NOT AVAILABLE"
          fi

          TOTAL_DOMAINS="$(wc -l < final_blocklist.txt | tr -d ' ')"

          echo "Total unique domains to process: $TOTAL_DOMAINS"

          account_num=1

          while true; do
            secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
            api_key_value="${!secret_name:-}"

            if [ -z "$api_key_value" ]; then
              echo "Finished checking all configured accounts."
              break
            fi

            echo "============================================================"
            echo "Syncing Account Index: $account_num"
            echo "============================================================"

            nextdnsctl auth "$api_key_value"

            for profile in "${TARGET_PROFILES[@]}"; do
              echo "------------------------------------------------------------"
              echo "Synchronizing profile: $profile"
              echo "Domains in source list: $TOTAL_DOMAINS"
              echo "------------------------------------------------------------"

              # Preserve the original import behavior:
              # --update-existing remains enabled.
              #
              # Optional performance/retry arguments are added only
              # when the installed nextdnsctl supports them.
              nextdnsctl \
                "${IMPORT_ARGS[@]}" \
                denylist import \
                "$profile" \
                final_blocklist.txt \
                --update-existing

              echo "Successfully synchronized profile: $profile"
            done

            account_num=$((account_num + 1))
          done

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f combined_raw.txt
          rm -f final_blocklist.txt
          echo "Temporary blocklist files removed."
