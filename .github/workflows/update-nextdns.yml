name: Update NextDNS Denylist

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-denylist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install nextdnsctl
        run: pip install nextdnsctl

      - name: Update denylist for all accounts
        env:
          NEXTDNS_ACCOUNT_1_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_1_API_KEY }}
          NEXTDNS_ACCOUNT_2_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_2_API_KEY }}
          NEXTDNS_ACCOUNT_3_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_3_API_KEY }}
          NEXTDNS_ACCOUNT_4_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_4_API_KEY }}
          NEXTDNS_ACCOUNT_5_API_KEY: ${{ secrets.NEXTDNS_ACCOUNT_5_API_KEY }}
        run: |
          set -euo pipefail

          LISTS_FILE="blocklists.txt"

          if [ ! -f "$LISTS_FILE" ]; then
            echo "::error::Blocklists file not found: $LISTS_FILE"
            exit 1
          fi

          url_count=$(grep -cv '^\s*$\|^\s*#' "$LISTS_FILE")

          if [ "$url_count" -eq 0 ]; then
            echo "::error::No URLs found in $LISTS_FILE"
            exit 1
          fi

          echo "Found $url_count blocklist URL(s)"

          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          COMBINED_RAW="$TEMP_DIR/blocklist_combined_raw.txt"
          touch "$COMBINED_RAW"

          echo "============================================================"
          echo "Downloading blocklists"
          echo "============================================================"

          url_index=1

          while IFS= read -r url || [ -n "$url" ]; do
            url=$(echo "$url" \
              | sed 's/[[:space:]]*$//' \
              | sed 's/^[[:space:]]*//')

            [ -z "$url" ] && continue

            case "$url" in
              \#*) continue ;;
            esac

            echo "Downloading list: $url"

            if curl -sfL "$url" -o "$TEMP_DIR/source_$url_index.txt"; then
              lines=$(wc -l < "$TEMP_DIR/source_$url_index.txt")
              echo "  ✓ Downloaded: $lines lines"
              cat "$TEMP_DIR/source_$url_index.txt" >> "$COMBINED_RAW"
            else
              echo "::error::Failed to download: $url"
              exit 1
            fi

            url_index=$((url_index + 1))

          done < "$LISTS_FILE"

          echo ""
          echo "Combined raw blocklist:"
          echo "$(wc -l < "$COMBINED_RAW") total lines"

          echo "============================================================"
          echo "Cleaning and deduplicating"
          echo "============================================================"

          CLEAN_FILE="$TEMP_DIR/blocklist_clean.txt"

          sed 's/#.*//' "$COMBINED_RAW" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sort -u > "$CLEAN_FILE"

          CLEAN_COUNT=$(wc -l < "$CLEAN_FILE")

          echo "✓ Normalized combined blocklist: $CLEAN_COUNT unique domains"

          account_num=1
          total_failed=0

          while true; do

            secret_name="NEXTDNS_ACCOUNT_${account_num}_API_KEY"
            api_key_value="${!secret_name:-}"

            if [ -z "$api_key_value" ]; then
              echo "No more accounts found."
              break
            fi

            echo ""
            echo "============================================================"
            echo "Processing Account Index: $account_num"
            echo "============================================================"

            export NEXTDNS_API_KEY="$api_key_value"

            echo "Fetching all profiles for account $account_num..."

            profiles=$(
              nextdnsctl profile-list 2>/dev/null \
                | grep -oP '^[a-z0-9]+(?=:)' \
                | grep -v '^$' || true
            )

            if [ -z "$profiles" ]; then
              echo "::warning::No profiles found for account $account_num"
              account_num=$((account_num + 1))
              continue
            fi

            echo "Found profiles:"
            echo "$profiles"

            account_failed=0

            for profile in $profiles; do

              echo ""
              echo "============================================================"
              echo "Profile: $profile"
              echo "Total source domains: $CLEAN_COUNT"
              echo "============================================================"

              CURRENT_FILE="$TEMP_DIR/current_${profile}.txt"
              STALE_FILE="$TEMP_DIR/stale_${profile}.txt"
              NEW_FILE="$TEMP_DIR/new_${profile}.txt"

              # ==================================================
              # READ CURRENT DENYLIST
              # ==================================================

              echo "Reading existing NextDNS denylist..."

              if nextdnsctl denylist export "$profile" 2>/dev/null \
                | sed 's/#.*//' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                | grep -v '^$' \
                | sort -u > "$CURRENT_FILE"; then

                EXISTING_COUNT=$(wc -l < "$CURRENT_FILE")

                echo "Existing denylist entries detected: $EXISTING_COUNT"

              else
                echo "::error::Failed to export denylist for profile $profile"
                account_failed=1
                total_failed=1
                continue
              fi

              # ==================================================
              # FIND STALE DOMAINS
              # ==================================================

              comm -23 "$CURRENT_FILE" "$CLEAN_FILE" > "$STALE_FILE"

              STALE_COUNT=$(wc -l < "$STALE_FILE")

              if [ "$STALE_COUNT" -gt 0 ]; then

                echo "Found $STALE_COUNT stale domain(s) to remove"
                echo "Removing stale domains..."

                echo "Denylist removal plan:"
                echo "  Domains to remove: $STALE_COUNT"

                if xargs -r nextdnsctl denylist remove "$profile" \
                  < "$STALE_FILE" 2>&1; then

                  echo "✓ Removed $STALE_COUNT stale domain(s)"

                else

                  echo "::warning::Some stale domains may not have been removed"

                fi

              else

                echo "No stale domains found"

              fi

              # ==================================================
              # CALCULATE DELTA
              # ==================================================

              comm -13 "$CURRENT_FILE" "$CLEAN_FILE" > "$NEW_FILE"

              NEW_COUNT=$(wc -l < "$NEW_FILE")

              echo "============================================================"
              echo "Denylist plan"
              echo "============================================================"
              echo "Total source domains: $CLEAN_COUNT"
              echo "Already present: $((CLEAN_COUNT - NEW_COUNT))"
              echo "New domains to add: $NEW_COUNT"
              echo "============================================================"

              if [ "$NEW_COUNT" -eq 0 ]; then
                echo "✓ Nothing new to upload."
                continue
              fi

              # ==================================================
              # UPLOAD
              #
              # Keep the previous proven upload behavior.
              # Only the progress/ETA calculation has been fixed.
              # ==================================================

              echo ""
              echo "============================================================"
              echo "🚀 Starting NextDNS upload"
              echo "============================================================"
              echo "Profile: $profile"
              echo "New domains: $NEW_COUNT"
              echo "Mode: Single import"
              echo "============================================================"

              START_TIME=$(date +%s)

              # Keep a copy of the last known progress.
              LAST_UPLOADED=0
              LAST_RATE=0
              LAST_ETA=0
              LAST_PROGRESS_TIME=$START_TIME

              # --------------------------------------------------
              # Upload in background so we can monitor progress.
              # --------------------------------------------------

              UPLOAD_LOG="$TEMP_DIR/upload_${profile}.log"

              (
                nextdnsctl denylist import \
                  "$profile" \
                  "$NEW_FILE" \
                  --update-existing
              ) > "$UPLOAD_LOG" 2>&1 &

              UPLOAD_PID=$!

              echo "📊 Live progress monitor started"

              # --------------------------------------------------
              # Monitor nextdnsctl output.
              #
              # The important fix:
              # If Uploaded has NOT increased since the previous
              # sample, do NOT replace the valid ETA with zero.
              # --------------------------------------------------

              while kill -0 "$UPLOAD_PID" 2>/dev/null; do

                sleep 30

                NOW=$(date +%s)
                ELAPSED=$((NOW - START_TIME))

                if [ "$ELAPSED" -lt 1 ]; then
                  ELAPSED=1
                fi

                # Look for the latest "Completed:" line.
                COMPLETED_LINE=$(
                  grep -E 'Completed: [0-9]+' "$UPLOAD_LOG" \
                    | tail -1 || true
                )

                if [ -n "$COMPLETED_LINE" ]; then

                  UPLOADED=$(
                    echo "$COMPLETED_LINE" \
                      | sed -n 's/.*Completed: \([0-9][0-9]*\).*/\1/p'
                  )

                  UPLOADED=${UPLOADED:-$LAST_UPLOADED}

                else

                  UPLOADED=$LAST_UPLOADED

                fi

                # Never allow progress to go backwards.
                if [ "$UPLOADED" -lt "$LAST_UPLOADED" ]; then
                  UPLOADED=$LAST_UPLOADED
                fi

                REMAINING=$((NEW_COUNT - UPLOADED))

                if [ "$REMAINING" -lt 0 ]; then
                  REMAINING=0
                fi

                # ------------------------------------------------
                # ONLY update rate/ETA when actual progress occurs.
                # ------------------------------------------------

                if [ "$UPLOADED" -gt "$LAST_UPLOADED" ]; then

                  DELTA_DOMAINS=$((UPLOADED - LAST_UPLOADED))
                  DELTA_TIME=$((NOW - LAST_PROGRESS_TIME))

                  if [ "$DELTA_TIME" -gt 0 ]; then

                    CURRENT_RATE=$(
                      awk "BEGIN {
                        printf \"%.2f\", $DELTA_DOMAINS / $DELTA_TIME
                      }"
                    )

                    ETA_SECONDS=$(
                      awk "BEGIN {
                        printf \"%d\", $REMAINING / $CURRENT_RATE
                      }"
                    )

                    LAST_RATE="$CURRENT_RATE"
                    LAST_ETA="$ETA_SECONDS"

                    LAST_PROGRESS_TIME=$NOW

                  fi

                  LAST_UPLOADED=$UPLOADED

                fi

                # ------------------------------------------------
                # Format ETA.
                #
                # If no new progress occurred, use the last valid
                # ETA instead of displaying 00:00:00.
                # ------------------------------------------------

                if [ "$LAST_ETA" -gt 0 ] 2>/dev/null; then

                  ETA_HOURS=$((LAST_ETA / 3600))
                  ETA_MINUTES=$(((LAST_ETA % 3600) / 60))
                  ETA_SECONDS_REMAINING=$((LAST_ETA % 60))

                  ETA_FORMATTED=$(printf \
                    "%02d:%02d:%02d" \
                    "$ETA_HOURS" \
                    "$ETA_MINUTES" \
                    "$ETA_SECONDS_REMAINING")

                else

                  ETA_FORMATTED="Calculating..."

                fi

                PROGRESS=$((UPLOADED * 100 / NEW_COUNT))

                echo ""
                echo "------------------------------------------------------------"
                echo "📊 NextDNS upload progress"
                echo "Profile: $profile"
                echo "Uploaded: $UPLOADED / $NEW_COUNT"
                echo "Remaining: $REMAINING"
                echo "Progress: ${PROGRESS}%"
                echo "Elapsed: $(printf '%02d:%02d:%02d' \
                  $((ELAPSED / 3600)) \
                  $(((ELAPSED % 3600) / 60)) \
                  $((ELAPSED % 60)))"
                echo "Rate: ${LAST_RATE} domains/sec"
                echo "ETA: $ETA_FORMATTED"
                echo "------------------------------------------------------------"

              done

              # ==================================================
              # WAIT FOR UPLOAD TO FINISH
              # ==================================================

              if wait "$UPLOAD_PID"; then

                END_TIME=$(date +%s)
                TOTAL_ELAPSED=$((END_TIME - START_TIME))

                echo ""
                echo "============================================================"
                echo "✅ NextDNS upload completed"
                echo "============================================================"
                echo "Profile: $profile"
                echo "Domains requested: $NEW_COUNT"
                echo "Elapsed: ${TOTAL_ELAPSED}s"
                echo "============================================================"

                cat "$UPLOAD_LOG"

              else

                echo ""
                echo "::error::NextDNS upload failed for profile $profile"
                echo ""
                cat "$UPLOAD_LOG"

                account_failed=1
                total_failed=1

              fi

            done

            if [ "$account_failed" -eq 0 ]; then
              echo ""
              echo "✓ All profiles updated successfully for account $account_num!"
            else
              echo ""
              echo "✗ Some profiles failed for account $account_num"
            fi

            account_num=$((account_num + 1))

          done

          echo ""
          echo "============================================================"
          echo "Update cycle complete"
          echo "============================================================"

          if [ "$total_failed" -eq 1 ]; then
            echo "::error::Some accounts had failures"
            exit 1
          fi

          echo "✓ All accounts processed successfully!"
